apiVersion: apps/v1
kind: Deployment
metadata:
  name: contato-service
  namespace: auventura
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contato-service
  template:
    metadata:
      labels:
        app: contato-service
    spec:
      containers:
        - name: contato-service
          image: auventura/backend:local
          imagePullPolicy: Never
          command: ["node", "services/contato-service/index.js"]
          ports:
            - containerPort: 3006
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: auventura
            - name: DB_USER
              value: auventura
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auventura-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auventura-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              value: 2h
            - name: CONTACT_SERVICE_PORT
              value: "3006"
            - name: BARRAMENTO_URL
              value: http://barramento-service:10000
---
apiVersion: v1
kind: Service
metadata:
  name: contato-service
  namespace: auventura
spec:
  selector:
    app: contato-service
  ports:
    - port: 3006
      targetPort: 3006
