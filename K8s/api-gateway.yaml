apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: auventura
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: auventura/backend:local
          imagePullPolicy: Never
          command: ["node", "services/api-gateway/index.js"]
          ports:
            - containerPort: 3000
          env:
            - name: API_GATEWAY_PORT
              value: "3000"
            - name: USER_SERVICE_URL
              value: http://user-service:3001
            - name: DEPOIMENTOS_SERVICE_URL
              value: http://depoimentos-service:3002
            - name: SCHEDULING_SERVICE_URL
              value: http://agendamentos-service:3003
            - name: PETS_SERVICE_URL
              value: http://pets-service:3004
            - name: DAYCARE_SERVICE_URL
              value: http://daycare-service:3005
            - name: CONTACT_SERVICE_URL
              value: http://contato-service:3006
            - name: NOTIFICACOES_SERVICE_URL
              value: http://notificacoes-service:3007
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: auventura
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
