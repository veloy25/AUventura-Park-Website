apiVersion: apps/v1
kind: Deployment

metadata:
  name: notificacoes-service
  namespace: auventura

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notificacoes-service

  template:
    metadata:
      labels:
        app: notificacoes-service

    spec:
      containers:
        - name: notificacoes-service

          image: localhost:5000/auventura/backend:local
          imagePullPolicy: IfNotPresent

          command:
            - node
            - services/notificacoes-service/index.js

          ports:
            - containerPort: 3007

          env:
            - name: DB_HOST
              value: db

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: auventura

            - name: DB_USER
              value: auventura

            - name: DB_PASSWORD
              value: auventura123

            - name: JWT_SECRET
              value: segredo123

            - name: JWT_EXPIRATION
              value: 2h

            - name: BARRAMENTO_URL
              value: http://barramento-service:10000

            - name: USER_SERVICE_PORT
              value: "3001"

            - name: NOTIFICACOES_SERVICE_PORT
              value: "3007"

---

apiVersion: v1
kind: Service

metadata:
  name: notificacoes-service
  namespace: auventura

spec:
  selector:
    app: notificacoes-service

  ports:
    - port: 3007
      targetPort: 3007