apiVersion: apps/v1
kind: Deployment

metadata:
  name: barramento-service
  namespace: auventura

spec:
  replicas: 1

  selector:
    matchLabels:
      app: barramento-service

  template:
    metadata:
      labels:
        app: barramento-service

    spec:
      containers:
        - name: barramento-service

          # Versão em Dart (back/services/barramento-service-dart).
          image: auventura/barramento-dart:local
          imagePullPolicy: Never

          ports:
            - containerPort: 10000

          livenessProbe:
            httpGet:
              path: /health
              port: 10000
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 10000
            initialDelaySeconds: 3
            periodSeconds: 5

          env:
            - name: BARRAMENTO_PORT
              value: "10000"

            - name: NOTIFICACOES_SERVICE_URL
              value: http://notificacoes-service:3007

---

apiVersion: v1
kind: Service

metadata:
  name: barramento-service
  namespace: auventura

spec:
  selector:
    app: barramento-service

  ports:
    - port: 10000
      targetPort: 10000
