apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: auventura

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service

          image: localhost:5000/auventura/backend:local
          imagePullPolicy: IfNotPresent

          command:
            - node
            - services/user-service/index.js

          ports:
            - containerPort: 3001

          env:
            - name: DB_HOST
              value: db

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: auventura

            - name: DB_USER
              value: auventura

            - name: DB_PASSWORD
              value: auventura123

            - name: JWT_SECRET
              value: segredo123

            - name: JWT_EXPIRATION
              value: 2h

            - name: USER_SERVICE_PORT
              value: "3001"

---

apiVersion: v1
kind: Service

metadata:
  name: user-service
  namespace: auventura

spec:
  selector:
    app: user-service

  ports:
    - port: 3001
      targetPort: 3001