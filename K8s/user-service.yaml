apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: auventura

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service

          # Versão em Dart (back/services/user-service-dart). O executável já
          # vem compilado na imagem, por isso não há "command".
          image: auventura/user-service-dart:local
          imagePullPolicy: Never

          ports:
            - containerPort: 3001

          # Liveness não toca no banco: o MySQL fora do ar não deve fazer o
          # Kubernetes reiniciar um processo saudável. Readiness consulta o
          # banco: sem ele o Pod sai do Service até voltar.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5

          env:
            - name: APP_ENV
              value: production

            - name: SERVER_PORT
              value: "3001"

            - name: DB_HOST
              value: db

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: auventura

            - name: DB_USER
              value: auventura

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auventura-secrets
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auventura-secrets
                  key: JWT_SECRET

            - name: JWT_EXPIRATION_HOURS
              value: "2"

            - name: BARRAMENTO_URL
              value: http://barramento-service:10000

---

apiVersion: v1
kind: Service

metadata:
  name: user-service
  namespace: auventura

spec:
  selector:
    app: user-service

  ports:
    - port: 3001
      targetPort: 3001
